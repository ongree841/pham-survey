<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลิงก์ของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #10181A;
    --card: #172224;
    --bone: #EDEAE0;
    --bone-dim: #A9A79C;
    --brass: #C9A15B;
    --teal: #5E8B85;
    --line: rgba(237,234,224,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--ink);
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 64px 20px 40px;
  }
  .page{ width:100%; max-width: 440px; }

  .profile{
    text-align:center;
    margin-bottom: 44px;
  }
  .avatar{
    width:72px; height:72px;
    border-radius:50%;
    background: linear-gradient(160deg, var(--teal), var(--brass));
    margin: 0 auto 20px;
  }
  .name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }
  .tagline{
    color: var(--bone-dim);
    font-size: 14.5px;
    line-height:1.6;
    max-width: 320px;
    margin: 0 auto;
  }

  .index{
    display:flex;
    flex-direction:column;
  }
  .card{
    display:flex;
    align-items:center;
    gap:16px;
    padding: 18px 4px;
    border-top: 1px solid var(--line);
    text-decoration:none;
    color: var(--bone);
    position:relative;
    transition: padding-left 0.25s ease, opacity 0.25s ease;
  }
  .index .card:last-child{ border-bottom: 1px solid var(--line); }
  .card:hover{ padding-left: 12px; }
  .card:hover .arrow{ transform: translateX(4px); opacity:1; }

  .mark{
    flex-shrink:0;
    width: 6px;
    height: 30px;
    border-radius: 1px;
  }
  .card.p1 .mark{ background: var(--brass); }
  .card.p2 .mark{ background: var(--teal); }
  .card.p3 .mark{ background: #8C6E9B; }
  .card.p4 .mark{ background: #B0785C; }

  .card-body{ flex:1; }
  .card-title{
    font-family:'Fraunces', serif;
    font-size: 18px;
    font-weight: 400;
    margin-bottom: 3px;
  }
  .card-sub{
    color: var(--bone-dim);
    font-size: 13px;
  }
  .arrow{
    color: var(--bone-dim);
    font-size: 18px;
    opacity: 0.5;
    transition: all 0.25s ease;
  }

  footer{
    text-align:center;
    margin-top: 48px;
    color: var(--bone-dim);
    font-size: 12.5px;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }
</style>
</head>
<body>
  <div class="page">

    <div class="profile">
      <div class="avatar"></div>
      <div class="name">ชื่อของคุณ</div>
      <p class="tagline">คำโปรยสั้นๆ บอกว่าคุณทำอะไร — เช่น นักออกแบบ, ครีเอเตอร์, ร้านค้าออนไลน์</p>
    </div>

    <div class="index">
      <a class="card p1" href="#">
        <div class="mark"></div>
        <div class="card-body">
          <div class="card-title">เว็บไซต์หลัก</div>
          <div class="card-sub">ดูผลงานและข้อมูลทั้งหมด</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="card p2" href="#">
        <div class="mark"></div>
        <div class="card-body">
          <div class="card-title">Instagram</div>
          <div class="card-sub">รูปภาพและอัปเดตล่าสุด</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="card p3" href="#">
        <div class="mark"></div>
        <div class="card-body">
          <div class="card-title">ร้านค้า</div>
          <div class="card-sub">สั่งซื้อสินค้าและบริการ</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="card p4" href="#">
        <div class="mark"></div>
        <div class="card-body">
          <div class="card-title">ติดต่อ</div>
          <div class="card-sub">อีเมลหรือไลน์สำหรับงานติดต่อ</div>
        </div>
        <div class="arrow">›</div>
      </a>
    </div>

    <footer>อัปเดตล่าสุด 2569</footer>
  </div>
</body>
</html>
